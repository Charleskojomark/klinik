server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy → FastAPI backend ──────────────────────────
    # Without this, /api calls return 404 from nginx (no Caddy = broken)
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # No caching — clinical data must always be fresh
        add_header         Cache-Control "no-cache, no-store, must-revalidate";
        proxy_no_cache     1;
        proxy_cache_bypass 1;

        # LLM consultation can take 60–90s — don't timeout early
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
    }

    # ── SPA fallback — all other routes → index.html ─────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip static assets ────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # ── Cache hashed static assets aggressively (Vite fingerprints filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── No-cache for index.html so new deployments are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
