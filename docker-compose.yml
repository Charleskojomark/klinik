version: "3.9"

services:
  # ──────────────────────────────────────────────
  # vLLM — LLM inference server (GPU profile only)
  # ──────────────────────────────────────────────
  vllm:
    image: rocm/vllm:latest
    ipc: host
    ports:
      - "8001:8000"
    command: >
      --model meta-llama/Llama-3.1-8B-Instruct
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.90
      --max-model-len 8192
      --host 0.0.0.0
      --port 8000
    volumes:
      - model_cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    profiles:
      - gpu

  # ──────────────────────────────────────────────
  # Backend — FastAPI + LangGraph agents
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL}
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    volumes:
      - ./backend:/app
      - ./data:/app/data

  # ──────────────────────────────────────────────
  # Frontend — React dashboard
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_SIMLI_API_KEY=${SIMLI_API_KEY:-}
        - VITE_SIMLI_FACE_ID=${SIMLI_FACE_ID:-afdb6a3e-3939-40aa-92df-01604c23101c}
        - VITE_LIVEKIT_URL=${LIVEKIT_URL:-}
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ──────────────────────────────────────────────
  # MuseTalk — Avatar lip-sync video service (GPU)
  # ──────────────────────────────────────────────
  musetalk:
    build:
      context: ./musetalk
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    devices:
      - /dev/kfd          # AMD ROCm kernel fusion driver
      - /dev/dri          # AMD GPU render nodes
    group_add:
      - video
    volumes:
      - ./musetalk/models:/musetalk/models   # model weights (persisted)
      - musetalk_videos:/musetalk/videos     # shared with backend for serving
      - ./musetalk/data:/musetalk/data       # avatar reference images
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0     # MI300X ROCm compatibility
    depends_on:
      - backend
    profiles:
      - musetalk   # start with: docker compose --profile musetalk up -d


volumes:
  model_cache:
  musetalk_videos:   # shared volume: musetalk writes, backend serves
